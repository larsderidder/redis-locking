name: CI

on:
  push:
    branches: [main]
  pull_request:

# Older supported Python versions have pip releases with outdated bundled roots.
env:
  PIP_CERT: /etc/ssl/certs/ca-certificates.crt

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Update system CA certificates
        run: sudo apt-get update && sudo apt-get install -y --reinstall ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Redis for interoperability tests
        run: sudo apt-get update && sudo apt-get install -y redis-server
      - name: Install package
        run: |
          # pip's truststore mode also loads its vendored roots.
          cp "$PIP_CERT" "$(python -m pip._vendor.certifi)"
          python -m pip install -U pip
          python -m pip install -e ".[dev,asyncio]"
      - name: Run tests
        run: pytest -q
