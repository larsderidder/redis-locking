[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "redis-locking"
version = "0.1.1"
description = "Convenience helpers for named Redis locks."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["python-redis-lock>=4.0"]

[project.optional-dependencies]
dev = ["black", "fakeredis[lua]", "pytest"]

[project.urls]
Homepage = "https://github.com/larsderidder/redis-locking"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 120
